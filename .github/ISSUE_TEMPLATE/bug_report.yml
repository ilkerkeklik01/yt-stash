name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please first try `pipx upgrade yt-stash` (or `pip install -U yt-stash`):
        YouTube changes often and an update fixes many download errors. Also read
        [Troubleshooting](https://github.com/ilkerkeklik01/yt-stash/blob/main/docs/troubleshooting.md).

        **Never paste cookies, cookie files or private links.**
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command, or the menu steps you took. Replace private links with `URL`.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output with `-v`
      description: Run the same command again with `-v` and paste the output. Remove anything private.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: yt-stash version
      description: Output of `yt-stash --version`
      placeholder: yt-stash 1.0.0
    validations:
      required: true
  - type: input
    id: ytdlp
    attributes:
      label: yt-dlp version
      description: Output of `yt-dlp --version` (run it in the same environment)
      placeholder: "2026.08.19"
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and installation method
      placeholder: Python 3.13, installed with pipx
  - type: dropdown
    id: ytdlp-check
    attributes:
      label: Does plain yt-dlp fail the same way?
      description: Try `yt-dlp URL`. If it fails too, the problem is in yt-dlp or YouTube.
      options:
        - I have not tried
        - It fails the same way
        - It works with yt-dlp
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues
          required: true
        - label: I removed cookies and private information from this report
          required: true

name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! yt-stash is a workflow layer over yt-dlp; read the
        [scope](https://github.com/ilkerkeklik01/yt-stash/blob/main/CONTRIBUTING.md#scope) first. If you
        are unsure, start a [Discussion](https://github.com/ilkerkeklik01/yt-stash/discussions).
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
      description: Describe what you are trying to do and why it is hard today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      description: Sketch the command, flag or menu entry you imagine.
      render: shell
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Workarounds, other tools, or a script that does it today.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would be willing to work on this with guidance

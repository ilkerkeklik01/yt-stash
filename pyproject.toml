[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "yt-stash"
dynamic = ["version"]
description = "Download YouTube videos and playlists from the terminal: pick any quality, run downloads in parallel, and save members-only videos."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ilker Keklik", email = "ilkerkeklik50@gmail.com" }]
keywords = ["youtube", "downloader", "cli", "yt-dlp", "playlist", "video", "audio", "subtitles"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = [
    "yt-dlp[default]>=2025.11.12",
    "rich>=13.7",
    "questionary>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "ruff>=0.16.10", "build>=1.6.1", "twine>=7.0.0"]

[project.urls]
Homepage = "https://github.com/ilkerkeklik01/yt-stash"
Documentation = "https://github.com/ilkerkeklik01/yt-stash/tree/main/docs"
Changelog = "https://github.com/ilkerkeklik01/yt-stash/blob/main/CHANGELOG.md"
Issues = "https://github.com/ilkerkeklik01/yt-stash/issues"
Source = "https://github.com/ilkerkeklik01/yt-stash"

[project.scripts]
yt-stash = "yt_stash.cli:main"

[tool.hatch.version]
path = "src/yt_stash/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_stash"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/README.md", "/LICENSE", "/CHANGELOG.md", "/CONTRIBUTING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not network'"
markers = ["network: tests that hit the real YouTube (run with: pytest -m network)"]

[tool.coverage.run]
source = ["yt_stash"]
branch = true

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["yt_stash"]
known-local-folder = ["conftest"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "RUF012", "RUF001"]
"src/yt_stash/i18n/tr.py" = ["RUF001", "RUF002"]  # Turkish letters such as ı are not typos

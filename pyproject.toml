[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ytgrab"
dynamic = ["version"]
description = "Cross-platform YouTube video & playlist downloader CLI with quality selection, parallel downloads and members-only support."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ilker Keklik", email = "ilkerkeklik50@gmail.com" }]
keywords = ["youtube", "downloader", "cli", "yt-dlp", "playlist"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "yt-dlp[default]>=2025.11.12",
    "rich>=13.7",
    "questionary>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
ytgrab = "ytgrab.cli:main"

[tool.hatch.version]
path = "src/ytgrab/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ytgrab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not network'"
markers = ["network: tests that hit the real YouTube (run with: pytest -m network)"]

[tool.coverage.run]
source = ["ytgrab"]
branch = true

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["ytgrab"]
known-local-folder = ["conftest"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "RUF012", "RUF001"]
